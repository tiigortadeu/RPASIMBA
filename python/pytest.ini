[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not cadastro and not servicenow"
markers =
    cadastro: clica em Cadastrar e cria um atendimento local no Simba (rodar só com autorização: -m cadastro)
    servicenow: cria e exclui work items de teste no ServiceNow do .env (rodar só com autorização: -m servicenow)
log_cli = true
log_cli_level = INFO
